/* ===== Facturas y PDF ===== */
.v-panel {

<script>(function(){var q=new URLSearchParams(location.search);window.CFG={vista:q.get('vista')||'inicio',tab:q.get('tab')||'',ver:'5.0.0-alpha11',fecha:'26 oct 2026'};})();</script>
<script>
/* ===== Inicio ===== */

function init_inicio(ROOT, P, S) {
  const $ = (id) => document.getElementById(id);
  const esc = (t) => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  function msg(t, tipo) { const m = $('h-msg'); if (!m) return; m.textContent = t; m.className = tipo || ''; }
  let REC = false;
  function pintarRec() { const b = $('b-rec'); if (!b) return; b.classList.toggle('on', REC); $('d-rec').textContent = REC ? 'Activado: el día 7 recibes el resumen por email.' : 'Desactivado.'; }

  /* 5.0.0-alpha11: saludo y tarjetas de estado */
  const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'], MESL = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  const gbpI = (n) => '£' + (Number(n) || 0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  (function () { const h = new Date(); $('ini-fecha').textContent = DIAS[h.getDay()].replace(/^./, (x) => x.toUpperCase()) + ' ' + h.getDate() + ' de ' + MESL[h.getMonth()] + ' de ' + h.getFullYear(); })();
  S.hub((d) => {
    if (!d || !$('ini-hola')) return;
    const nom = String((window.pbCuenta && window.pbCuenta.nombre && window.pbCuenta.nombre()) || d.nombre || '').trim().split(/\s+/)[0];
    $('ini-hola').textContent = 'Hola' + (nom ? ', ' + nom : '') + ' 👋';
    if (d.periodo) $('ini-fecha').textContent += ' · periodo ' + d.periodo;
    if (d.periodoFin) {
      const f = new Date(d.periodoFin + 'T23:59:59'), dias = Math.max(0, Math.ceil((f - new Date()) / 864e5));
      $('e-dias').textContent = dias === 0 ? 'hoy se cierra' : dias + (dias === 1 ? ' día' : ' días'); $('e-dias').className = dias <= 3 ? 'warn' : '';
    } else $('e-dias').textContent = '—';
    const pe = d.pendiente || { total: 0, n: 0 };
    $('e-pend').textContent = pe.total ? gbpI(pe.total) + ' · ' + pe.n + (pe.n === 1 ? ' factura' : ' facturas') : 'nada pendiente'; $('e-pend').className = pe.total ? 'warn' : 'ok';
    if (d.hmrc) { $('e-hmrc').textContent = d.hmrc.fecha; $('e-hmrc-l').textContent = 'Declaración ' + d.hmrc.anio + ' (HMRC)'; }
  });
  if (window.pbDatos && window.pbDatos.ultimaCopia) {
    window.pbDatos.ultimaCopia().then((ms) => {
      if (ms === null) { $('e-copia').textContent = 'modo de ejemplo'; return; }
      if (!ms) { $('e-copia').textContent = 'nunca · haz una'; $('e-copia').className = 'warn'; return; }
      const dd = new Date(ms), hoy = new Date(), hh = String(dd.getHours()).padStart(2, '0') + ':' + String(dd.getMinutes()).padStart(2, '0');
      const dias = Math.floor((new Date(hoy.toDateString()) - new Date(dd.toDateString())) / 864e5);
      $('e-copia').textContent = dias <= 0 ? 'hoy, ' + hh : dias === 1 ? 'ayer, ' + hh : 'hace ' + dias + ' días'; $('e-copia').className = dias > 7 ? 'warn' : 'ok';
    }).catch(() => { $('e-copia').textContent = '—'; });
    $('e-copia-c').style.cursor = 'pointer'; $('e-copia-c').onclick = () => S.ir('datos');
  } else $('e-copia-c').classList.add('hidden');
  S.hub((d) => {
    const n = $('n-rev'); if (!n) return;
    if (!d) { n.textContent = '—'; return; }
    n.textContent = d.avisos ? d.avisos + (d.avisos === 1 ? ' aviso' : ' avisos') : 'todo bien';
    n.className = 'pill' + (d.avisos ? ' warn' : '');
    REC = d.recordatorio; pintarRec();
  });

  ROOT.querySelectorAll('[data-go]').forEach((b) => (b.onclick = () => S.ir(b.dataset.go)));

  $('b-rev').onclick = () => {
    $('rev').style.display = 'block'; $('rev-b').textContent = 'Revisando…';
    google.script.run.withSuccessHandler((l) => {
      $('rev-b').innerHTML = l.length ? '<ul>' + l.map((a) => '<li>' + esc(a.texto) + '</li>').join('') + '</ul>' : 'Todo en orden: no he encontrado nada que revisar.';
    }).withFailureHandler((e) => { const r = $('rev-b'); if (r) r.textContent = e.message; }).getRevision();
  };
  $('rev-x').onclick = () => ($('rev').style.display = 'none');

  $('b-resumen').onclick = () => {
    const b = $('b-resumen'); b.disabled = true; msg('Enviando el resumen…');
    google.script.run.withSuccessHandler((para) => { b.disabled = false; msg('Resumen enviado a ' + para, 'ok'); })
      .withFailureHandler((e) => { b.disabled = false; msg(e.message.replace(/^Exception: /, ''), 'err'); }).hubEnviarResumen();
  };

  $('b-rec').onclick = () => {
    const b = $('b-rec'); b.disabled = true;
    google.script.run.withSuccessHandler((on) => { b.disabled = false; REC = on; pintarRec(); msg(on ? 'Recordatorio mensual activado.' : 'Recordatorio mensual desactivado.', 'ok'); })
      .withFailureHandler((e) => { b.disabled = false; msg(e.message.replace(/^Exception: /, ''), 'err'); }).hubRecordatorio(!REC);
  };
  return {};
}

/* ===== Facturas y PDF ===== */
function init_panel(ROOT, P, S) {

  let DATA = null, TAB = 'facturas';
  const $ = (s) => document.querySelector(s);
  const gbp = (n) => (n < 0 ? '-' : '') + '£' + Math.abs(n || 0).toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function toast(html, ms) {
    const t = $('#toast');
    t.innerHTML = html; t.style.display = 'block';
    clearTimeout(t._h); t._h = setTimeout(() => (t.style.display = 'none'), ms || 6000);
  }

  function cargar(periodo) {
    google.script.run
      .withSuccessHandler((d) => { DATA = d; pintar(); })
      .withFailureHandler((e) => { $('#app').innerHTML = '<div class="empty">No he podido cargar los datos.<br>' + esc(e.message) + '</div>'; })
      .getPanelData(periodo || null, (S.negocio && S.negocio()) || null);
  }

  function pintar() {
    const d = DATA, r = d.resumen;
    const sel = $('#periodo');
    sel.innerHTML = d.periodos.map((p) => '<option' + (p === d.actual ? ' selected' : '') + ' value="' + esc(p) + '">' + (p === 'TODOS' ? 'Todos los periodos' : esc(p)) + '</option>').join('');
    sel.onchange = () => { $('#app').innerHTML = '<div class="loading">Cargando datos…</div>'; cargar(sel.value); };

    const nAv = d.avisos.length;
    $('#app').innerHTML =
      '<div class="tiles">' +
        tile(d.actual === 'TODOS' ? 'Ingresos totales' : 'Ingresos', gbp(r.ingresos), r.nIngresos + ' facturas', 't-ing', r.ingresos) +
        tile(d.actual === 'TODOS' ? 'Gastos totales' : 'Gastos', gbp(r.gastos), r.nGastos + ' gastos', 't-gas', r.gastos) +
        tile('Ganancia', gbp(r.ganancia), r.ingresos ? Math.round(r.ganancia / r.ingresos * 100) + '% de los ingresos' : '', r.ganancia < 0 ? 't-gas' : 't-gan', r.ganancia) +
        tile('Pendiente de cobro', gbp(r.pendiente), '', 't-pen', r.pendiente) +
      '</div>' +
      '<nav role="tablist">' +
        tab('facturas', 'Facturas') + tab('gastos', 'Gastos por categoría') +
        tab('avisos', 'Revisión' + (nAv ? '<span class="count">' + nAv + '</span>' : '')) +
      '</nav>' +
      '<div class="card" id="contenido"></div>' +
      '<div class="foot"><span>El envío a Universal Credit lo haces tú; aquí tienes las cifras listas.</span>' +
      '<button class="btn" id="procesar">Marcar este periodo como procesado en UC</button></div>';

    document.querySelectorAll('nav button').forEach((b) => (b.onclick = () => { TAB = b.dataset.tab; pintar(); }));
    $('#procesar').onclick = marcarProcesado;
    if (d.actual === 'TODOS') { $('#procesar').disabled = true; $('#procesar').title = 'Elige un periodo concreto'; }
    $('#contenido').innerHTML = TAB === 'facturas' ? vistaFacturas() : TAB === 'gastos' ? vistaGastos() : vistaAvisos();
    document.querySelectorAll('[data-paid]').forEach((b) => (b.onclick = () => {
      b.disabled = true;
      google.script.run.withSuccessHandler(() => { toast('Factura ' + (b.dataset.num || b.dataset.paid) + ' marcada como pagada'); cargar(DATA.actual); })
        .withFailureHandler((e) => { b.disabled = false; toast('Error: ' + esc(e.message), 8000); }).marcarFacturaPagada(Number(b.dataset.paid));
    }));
    document.querySelectorAll('[data-pdf]').forEach((b) => (b.onclick = () => pedirNota(b, 'generarFactura', b.dataset.pdf)));
    document.querySelectorAll('[data-mail]').forEach((b) => (b.onclick = () => pedirNota(b, 'enviarFactura', b.dataset.mail)));
  }

  const tile = (k, v, s, cls, num) => '<div class="tile ' + (Math.abs(num) < 0.005 ? 't-cero' : cls) + '"><div class="k">' + k + '</div><div class="v">' + v + '</div><div class="s">' + (s || '&nbsp;') + '</div></div>';
  const tab = (id, t) => '<button role="tab" data-tab="' + id + '" aria-selected="' + (TAB === id) + '">' + t + '</button>';

  function vistaFacturas() {
    if (!DATA.facturas.length) return '<div class="empty">Todavía no hay facturas. Añade la primera en la hoja Ingresos.</div>';
    return '<div class="scroll"><table><thead><tr><th>Nº</th><th>Cliente</th><th>Fecha</th><th class="r">Total</th><th>Estado</th><th></th></tr></thead><tbody>' +
      DATA.facturas.map((f) =>
        '<tr><td><b>' + esc(f.num || f.id) + '</b>' + ((S.negocios && S.negocios().length > 1 && !(S.negocio && S.negocio())) ? '<br>' + S.pill(f.negocio) : '') + '</td><td>' + esc(f.cliente) + '</td><td>' + esc(f.evento) + '</td><td class="r">' + gbp(f.total) + '</td>' +
        '<td><span class="pill ' + esc(f.estado) + '">' + esc(f.estado) + '</span></td>' +
        '<td>' + (f.estado === 'CANCELLED'
          ? '<div class="actions" style="color:var(--muted);font-size:12px">Cancelada · no suma</div>'
          : '<div class="actions">' + (f.estado === 'PENDING' ? '<button class="btn" data-paid="' + f.id + '" data-num="' + esc(f.num || f.id) + '">Marcar pagada</button>' : '') +
            '<button class="btn" data-pdf="' + f.id + '" data-num="' + esc(f.num || f.id) + '" title="Crear el PDF de la factura">PDF</button><button class="btn primary" data-mail="' + f.id + '" data-num="' + esc(f.num || f.id) + '" title="Enviar la factura al cliente por email">Enviar</button></div>') + '</td></tr>'
      ).join('') + '</tbody></table></div>';
  }

  function vistaGastos() {
    const cats = DATA.categorias, tot = cats.reduce((t, c) => t + c.importe, 0);
    if (!cats.length) return '<div class="empty">Este periodo no tiene gastos.</div>';
    return '<table><thead><tr><th>Categoría UC</th><th>Peso</th><th class="r">Importe</th></tr></thead><tbody>' +
      cats.map((c) => '<tr><td>' + esc(c.nombre) + '</td><td><div class="bar"><i style="width:' + (tot ? Math.round(c.importe / tot * 100) : 0) + '%"></i></div></td><td class="r">' + gbp(c.importe) + '</td></tr>').join('') +
      '<tr><td><b>Total</b></td><td></td><td class="r"><b>' + gbp(tot) + '</b></td></tr></tbody></table>';
  }

  function vistaAvisos() {
    if (!DATA.avisos.length) return '<div class="empty">Todo en orden. No hay nada que revisar.</div>';
    return '<ul class="avisos">' + DATA.avisos.map((a) => '<li><span class="dot ' + a.nivel + '"></span><span>' + esc(a.texto) + '</span></li>').join('') + '</ul>';
  }

  function pedirNota(btn, fn, id) {
    btn.disabled = true;
    google.script.run
      .withSuccessHandler((nota) => {
        btn.disabled = false;
        $('#nota-txt').value = nota;
        $('#nota-guardar').checked = false;
        $('#nota-si').textContent = fn === 'enviarFactura' ? 'Crear y enviar' : 'Crear PDF';
        $('#nota-t').textContent = 'Factura ' + (btn.dataset.num || id) + ': revisa la nota al pie';
        $('#nota-bg').classList.add('on'); $('#nota-txt').focus();
        const cerrar = () => { $('#nota-bg').classList.remove('on'); };
        $('#nota-no').onclick = cerrar;
        $('#nota-si').onclick = () => { const t = $('#nota-txt').value, g = $('#nota-guardar').checked; cerrar(); accion(btn, fn, id, t, g); };
      })
      .withFailureHandler((e) => { btn.disabled = false; toast('Error: ' + esc(e.message), 8000); })
      .getNotaFactura(Number(id));
  }

  function accion(btn, fn, id, nota, guardar) {
    const txt = btn.textContent; btn.disabled = true; btn.textContent = 'Un momento…';
    google.script.run
      .withSuccessHandler((res) => {
        btn.disabled = false; btn.textContent = txt;
        toast(fn === 'enviarFactura' ? 'Factura ' + (btn.dataset.num || id) + ' enviada a ' + esc(res.para) + '<a href="' + res.url + '" target="_blank">Ver PDF</a>'
                                      : 'PDF guardado en Drive<a href="' + res.url + '" target="_blank">Abrir</a>');
      })
      .withFailureHandler((e) => { btn.disabled = false; btn.textContent = txt; toast('No se pudo completar: ' + esc(e.message), 9000); })
      [fn](Number(id), nota);
    if (guardar) google.script.run.guardarNotaNegocio(Number(id), nota);
  }

  let confirmando = false;
  function marcarProcesado() {
    const b = document.getElementById('procesar');
    if (!confirmando) {
      confirmando = true;
      if (b) { b.dataset.t = b.textContent; b.textContent = 'Pulsa otra vez para confirmar'; }
      setTimeout(() => { confirmando = false; if (b && b.dataset.t) b.textContent = b.dataset.t; }, 5000);
      return;
    }
    confirmando = false; if (b && b.dataset.t) b.textContent = b.dataset.t;
    google.script.run
      .withSuccessHandler((n) => toast(n + ' filas marcadas como procesadas'))
      .withFailureHandler((e) => toast('Error: ' + esc(e.message), 8000))
      .marcarPeriodoProcesado(DATA.actual);
  }

  cargar();

  return {};
}

/* ===== Formularios ===== */
function init_form(ROOT, P, S) {

  let D = null, TAB = P.tab || 'ingreso', EDIT = null, REG = [], REGTIPO = 'ingreso';

    if (D.proveedores.indexOf(p) >= 0) $('g-prov').value = p;

    if (D.categorias.indexOf(gc) >= 0) $('g-cat').value = gc;

    aplicarNegocio(D.negocio);

    previews();
  }

  /* ---- negocio de cada formulario ---- */
  function negF(id) { return D && (D.negocios || []).find((n) => n.id === id); }
  function negDefecto() {
    const l = (D && D.negocios) || [];
    if (l.length === 1) return l[0].id;
    const s = S.negocio && S.negocio();
    return s && l.some((n) => n.id === s) ? s : '';
  }
  function pintarNegCh(t) {
    const l = (D && D.negocios) || [], pre = t === 'ingreso' ? 'i' : 'g';
    $(pre + '-neg-w').classList.toggle('hidden', l.length < 2);

    if (t === 'ingreso') { const n = negF(NF.ingreso); if (n) aplicarNegocio(Object.assign({ clave: n.tipo }, n.tipoInfo)); }
  }
  ['ingreso', 'gasto'].forEach((t) => {
    $((t === 'ingreso' ? 'i' : 'g') + '-neg').addEventListener('click', (e) => {
      const b = e.target.closest('button[data-n]'); if (!b) return;

  });

  function aplicarNegocio(n) {
    if (!n) return;
    const viejo = $('i-desc').value;
    $('l-evento').textContent = n.fecha; $('l-cliente').textContent = n.cliente; $('o-unit').textContent = n.unidad;

  function periodoDe(iso) { const p = D && D.periodos.find((x) => x.ini <= iso && iso <= x.fin); return p ? p.etiqueta : ''; }

  function previews() {
    if (!D) return;

    $('i-prev-tot').textContent = gbp($('i-precio').value * $('i-cant').value);
    $('g-prev-id').textContent = 'Gasto nº ' + (EDIT && EDIT.tipo === 'gasto' ? EDIT.id : D.idGasto);

  function mostrar(tab) {

    $('ttl').textContent = T[0]; $('sub').textContent = T[1];

      categoria: 'Guardar categoría', periodos: 'Añadir periodos', ajustes: 'Guardar ajustes' }[tab];
    if (tab === 'ajustes') { cargarAjustes(); cargarMN(); }
    if (tab === 'cliente' && EDITCLI) $('guardar').textContent = 'Guardar cambios';
    if (tab === 'cliente' || tab === 'proveedor' || tab === 'categoria') listaCargar(tab);
    if (tab === 'registros') cargarRegistros();
    if (tab === 'gasto' || tab === 'ingreso') histCargar(tab);
    if (tab === 'ingreso') taxPedir();
  }

  document.querySelectorAll('[data-ir]').forEach((b) => (b.onclick = () => mostrar(b.dataset.ir)));
  document.querySelectorAll('input, select').forEach((el) => el.addEventListener('input', previews));
  $('g-prov').addEventListener('change', () => $('g-nuevo-wrap').classList.toggle('hidden', $('g-prov').value !== '__nuevo__'));
  $('g-unidad').addEventListener('change', () => { if ($('g-unidad').value === 'MILLAS' && !$('g-precio').value) { $('g-precio').value = '0.45'; previews(); } });

  const ETIQ = { nombre: 'Tu nombre', direccion: 'Dirección', ciudad_postcode: 'Ciudad y postcode', telefono: 'Teléfono', email: 'Email',
    banco: 'Banco', titular: 'Titular de la cuenta', sort_code: 'Sort code', cuenta: 'Número de cuenta', nota_factura: 'Nota al pie de la factura',
    plazo_pago_dias: 'Días para pagar', email_resumen: 'Email para el resumen UC', carpeta_facturas: 'Carpeta de Drive para los PDF', color_factura: 'Color de la factura' };
  let AJ = null;
  const attr = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  function cargarAjustes() {
    if (AJ) return;
    google.script.run.withSuccessHandler((lista) => {
      AJ = lista;
      $('aj-lista').innerHTML = lista.map((a, i) => '<div class="' + (['nota_factura', 'direccion'].indexOf(a.clave) >= 0 ? 'full' : '') + '">' +
        '<label for="aj-' + i + '">' + (ETIQ[a.clave] || a.clave) + '</label><input id="aj-' + i + '" value="' + attr(a.valor) + '">' +
        (a.desc ? '<div class="hint">' + attr(a.desc) + '</div>' : '') + '</div>').join('');
    }).withFailureHandler((e) => msg('No he podido cargar los ajustes: ' + e.message, 'err')).getAjustes();
  }
  function leerAjustes() { const o = {}; (AJ || []).forEach((a, i) => (o[a.clave] = $('aj-' + i).value)); return o; }

  const val = (id) => $(id).value;
  const lecturas = {
    ingreso: () => ({ cliente: val('i-cliente'), descripcion: val('i-desc'), fechaEvento: val('i-evento'), fechaFactura: val('i-factura'),
      unidad: val('i-unidad'), precio: val('i-precio'), cantidad: val('i-cant'), formaPago: val('i-pago'), estado: val('i-estado'), negocio: NF.ingreso }),
    gasto: () => ({ fecha: val('g-fecha'), proveedor: val('g-prov') === '__nuevo__' ? val('g-nuevo') : val('g-prov'), descripcion: val('g-desc'),
      categoria: val('g-cat'), unidad: val('g-unidad'), cantidad: val('g-cant'), precio: val('g-precio'), notas: val('g-notas'), negocio: NF.gasto })
  };

  function limpiar(tab) {
    const vacios = { registros: [], ingreso: ['i-precio'], gasto: ['g-desc', 'g-precio', 'g-notas', 'g-nuevo'], proveedor: ['p-nombre', 'p-notas'], cliente: ['c-nombre', 'c-dir', 'c-ciudad', 'c-post', 'c-tel', 'c-email'], categoria: ['k-nombre', 'k-desc'], periodos: [], ajustes: [] };
    vacios[tab].forEach((id) => ($(id).value = ''));
    if (tab === 'ingreso' || tab === 'gasto') { NF[tab] = negDefecto(); if (D) pintarNegCh(tab); }
    if (tab === 'cliente') finEditarCliente();
    // 5.0.0: al guardar, el formulario queda en blanco (como nuevo), sin los datos copiados
    if (tab === 'ingreso') {
      ['i-cliente', 'i-desc'].forEach((id) => ($(id).value = ''));

      $('g-unidad').selectedIndex = 0; $('g-cant').value = '1'; $('g-nuevo-wrap').classList.add('hidden'); if (D) $('g-fecha').value = D.hoy;
      H.gasto.fil = ''; if (H.gasto.data) histPintar('gasto');

  $('guardar').onclick = () => {
    const tab = TAB, btn = $('guardar'), texto = btn.textContent;
    if ((tab === 'ingreso' || tab === 'gasto') && D && (D.negocios || []).length > 1 && !NF[tab]) { msg('Elige de qué negocio es: pulsa uno arriba, en «Negocio».', 'err'); return; }
    btn.disabled = true; btn.textContent = 'Guardando…'; msg('');
    const ok = (r) => {
      btn.disabled = false; btn.textContent = texto;

        ingreso: 'Ingreso guardado: factura ' + (r.num || r.id) + ' · ' + gbp(r.subtotal) + ' · ' + r.periodo,
        gasto: 'Gasto guardado: nº ' + r.id + ' · ' + gbp(r.subtotal) + ' · ' + r.periodo + (r.proveedorNuevo ? ' · proveedor añadido a la lista' : ''),
        proveedor: 'Proveedor "' + (r && r.nombre) + '" añadido',
        cliente: EDITCLI ? 'Cliente "' + (r && r.nombre) + '" actualizado' + (r && r.cambiados ? ' (también en ' + r.cambiados + ' ingresos)' : '') : 'Cliente "' + (r && r.nombre) + '" añadido',

    const run = google.script.run.withSuccessHandler(ok).withFailureHandler(fail);

    else if (tab === 'gasto') { if (EDIT) run.actualizarGasto(EDIT.id, lecturas.gasto()); else run.guardarGasto(lecturas.gasto()); }

    else if (tab === 'categoria') run.guardarCategoria(val('k-nombre'), val('k-desc'));
    else if (tab === 'periodos') run.anadirPeriodos(val('pe-n'));

    else {

      '<div class="d">' + esc(r.fecha) + ' · ' + esc(r.detalle) + (r.estado ? ' · ' + esc(r.estado) : '') + '</div></div><div class="m">' + gbp(r.total) + '</div>' +
      '<div class="acc"><button class="btn" data-ed="' + r.id + '"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg> Editar</button> <button class="btn" data-del="' + r.id + '"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg> Eliminar</button></div></div>').join('')

  function setTipo(t) {

  $('lista-reg').addEventListener('click', (ev) => {

    } else if (b.dataset.no) pintarRegistros();

  function editar(id) {
    const desde = TAB;

    google.script.run.withSuccessHandler((r) => {
      const tipo = REGTIPO; EDIT = { tipo: tipo, id: id, num: r.num, desde: desde === 'registros' ? 'registros' : tipo };

  /* ---------- 5.0.0-alpha8: listas a la par de Cliente, Proveedor y Categoría ---------- */
  function listaCargar(t, forzar) {
    const box = $('ls-' + t);
    if (LISTAS && !forzar) { listaPintar(t); return; }
    box.innerHTML = '<div class="hh"><b>Cargando…</b></div>';
    google.script.run.withSuccessHandler((l) => { LISTAS = l; listaPintar(t); })
      .withFailureHandler((e) => { box.innerHTML = '<div class="vacio">No he podido cargar la lista: ' + esc(e.message) + '</div>'; }).getListas();
  }
  function listaFilas(t) {
    const q = LQ[t];
    const l = (LISTAS && LISTAS[t === 'cliente' ? 'clientes' : t === 'proveedor' ? 'proveedores' : 'categorias']) || [];
    return l.filter((x) => !q || Object.keys(x).map((k) => x[k]).join(' ').toLowerCase().indexOf(q) >= 0)
      .sort((a, b) => String(a.nombre).localeCompare(String(b.nombre), 'es'));
  }
  function listaPintar(t) {
    const box = $('ls-' + t), l = listaFilas(t);
    const total = ((LISTAS && LISTAS[t === 'cliente' ? 'clientes' : t === 'proveedor' ? 'proveedores' : 'categorias']) || []).length;
    const tit = { cliente: 'Tus clientes', proveedor: 'Tus proveedores', categoria: 'Tus categorías' }[t];
    const cab = t === 'cliente' ? ['Nombre', 'Ciudad', 'Postcode', 'Email', 'Teléfono', 'Facturas'] : t === 'proveedor' ? ['Nombre', 'Notas', 'Gastos'] : ['Nombre', 'Descripción', 'Gastado ' + (LISTAS ? LISTAS.anio : '')];
    const fila = (x) => t === 'cliente'
      ? '<tr data-cli="' + attr(x.nombre) + '"' + (x.nombre === EDITCLI ? ' class="sel"' : '') + '><td class="x"><b>' + esc(x.nombre) + '</b></td><td class="x">' + esc(x.ciudad) + '</td><td class="x">' + esc(x.postcode) + '</td><td class="x" title="' + attr(x.email) + '">' + esc(x.email) + '</td><td class="x">' + esc(x.telefono) + '</td><td class="m">' + x.facturas + '</td></tr>'
      : t === 'proveedor'
        ? '<tr><td class="x"><b>' + esc(x.nombre) + '</b></td><td class="x" title="' + attr(x.notas) + '">' + esc(x.notas) + '</td><td class="m">' + x.gastos + '</td></tr>'
        : '<tr><td class="x"><b>' + esc(x.nombre) + '</b></td><td class="x" title="' + attr(x.descripcion) + '">' + esc(x.descripcion) + '</td><td class="m">' + gbp(x.total) + '</td></tr>';
    box.innerHTML = '<div class="hh"><b>' + tit + ' (' + total + ')</b><button class="btn" type="button" data-lcopiar="1">Copiar lista</button></div>' +
      '<input class="buscar" type="search" id="lq-' + t + '" placeholder="🔍 Buscar" value="' + attr(LQ[t]) + '">' +
      (l.length ? '<div class="tw"><table class="hoja lst-' + t + '"><thead><tr>' + cab.map((x, k) => '<th' + (k === cab.length - 1 ? ' class="m"' : '') + '>' + x + '</th>').join('') + '</tr></thead><tbody>' + l.map(fila).join('') + '</tbody></table></div>'
        : '<div class="vacio">' + (total ? 'No hay nada con esa búsqueda.' : 'Todavía no hay ninguno. Añade el primero con el formulario.') + '</div>') +
      (t === 'cliente' && l.length ? '<div class="nota">Pulsa un cliente y sus datos pasan al formulario para corregirlos.</div>' : '');
  }
  ['cliente', 'proveedor', 'categoria'].forEach((t) => {
    const box = $('ls-' + t);
    box.addEventListener('input', (ev) => {
      if (ev.target.id !== 'lq-' + t) return;
      LQ[t] = ev.target.value.trim().toLowerCase();
      const pos = ev.target.selectionStart; listaPintar(t);
      const q = $('lq-' + t); if (q) { q.focus(); try { q.setSelectionRange(pos, pos); } catch (e) { } }
    });
    box.addEventListener('click', (ev) => {
      if (ev.target.closest('[data-lcopiar]')) {
        const l = listaFilas(t);
        const filas = l.map((x) => (t === 'cliente' ? [x.nombre, x.direccion, x.ciudad, x.postcode, x.telefono, x.email, x.facturas] : t === 'proveedor' ? [x.nombre, x.notas, x.gastos] : [x.nombre, x.descripcion, x.total.toFixed(2)]).join('\t'));
        const cab = t === 'cliente' ? 'Nombre\tDirección\tCiudad\tPostcode\tTeléfono\tEmail\tFacturas' : t === 'proveedor' ? 'Nombre\tNotas\tGastos' : 'Nombre\tDescripción\tGastado';
        copiarTexto([cab].concat(filas).join('\n')); msg('Lista copiada (' + l.length + ').', 'ok'); return;
      }
      const tr = ev.target.closest('tr[data-cli]');
      if (tr && t === 'cliente') editarCliente(tr.dataset.cli);
    });
  });
  function editarCliente(nombre) {
    const x = ((LISTAS && LISTAS.clientes) || []).find((c) => c.nombre === nombre); if (!x) return;
    EDITCLI = x.nombre;
    $('c-nombre').value = x.nombre; $('c-dir').value = x.direccion; $('c-ciudad').value = x.ciudad; $('c-post').value = x.postcode; $('c-tel').value = x.telefono; $('c-email').value = x.email;
    $('c-edtxt').textContent = 'Corrigiendo a ' + x.nombre;
    $('c-editando').classList.remove('hidden');
    $('guardar').textContent = 'Guardar cambios'; msg('');
    listaPintar('cliente');
  }
  function finEditarCliente() {
    EDITCLI = null; $('c-editando').classList.add('hidden');
    if (TAB === 'cliente') $('guardar').textContent = 'Guardar cliente';
    if (LISTAS) listaPintar('cliente');
  }
  $('c-cancel').onclick = () => { ['c-nombre', 'c-dir', 'c-ciudad', 'c-post', 'c-tel', 'c-email'].forEach((id) => ($(id).value = '')); finEditarCliente(); };

  /* ---------- 5.0.0-alpha11: Apariencia y seguridad ---------- */
  function pintarApar() {
    let t = 'claro'; try { t = localStorage.getItem('pb_tema') || 'claro'; } catch (e) { }
    $('ap-tema').querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.tema === t)));
    const disp = window.pbBloqueo && window.pbBloqueo.disponible();
    $('ap-bloq-w').classList.toggle('hidden', !disp);
    if (disp) { const m = String(window.pbBloqueo.minutos()); $('ap-bloq').querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.min === m))); }
  }
  $('ap-tema').addEventListener('click', (e) => { const b = e.target.closest('button[data-tema]'); if (!b) return; S.tema(b.dataset.tema); pintarApar(); });
  $('ap-bloq').addEventListener('click', (e) => { const b = e.target.closest('button[data-min]'); if (!b || !window.pbBloqueo) return; window.pbBloqueo.poner(Number(b.dataset.min)); pintarApar(); });
  pintarApar();

  /* ---------- 5.0.0-alpha8: Ajustes › Mis negocios (nombre, tipo, prefijo, nombre en factura y logo de cada uno) ---------- */
  const mnm = (t, tipo) => { const m = $('mn-msg'); m.textContent = t || ''; m.style.color = tipo === 'err' ? 'var(--bad)' : (tipo === 'ok' ? '#067647' : ''); };
  function cargarMN(despues) {
    google.script.run.withSuccessHandler((r) => {
      MN = r; S.negociosCargados && S.negociosCargados(r.lista, r.logos); pintarMN(); if (despues) despues();
      let ir = ''; try { ir = sessionStorage.getItem('pb_ir_negocios'); sessionStorage.removeItem('pb_ir_negocios'); } catch (e) { }
      if (ir) { MNED = { nuevo: true }; pintarMN(); $('mn').scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    }).withFailureHandler((e) => { $('mn-lista').innerHTML = '<div class="hint">No he podido cargar tus negocios: ' + esc(e.message) + '</div>'; }).getNegocios();
  }
  function formMN(n) {
    const tipos = (MN.tipos || []).map((t) => '<button type="button" data-tipo="' + attr(t.clave) + '" aria-pressed="' + (t.clave === (n.tipo || 'dj')) + '"><b>' + esc(t.nombre) + '</b><small>' + esc(t.fecha) + ' · ' + esc(t.cliente) + '</small></button>').join('');
    const logo = n.id ? (MN.logos[n.id] || '') : '';
    return '<div class="ed" data-ed="' + attr(n.id || '') + '"><div class="grid">' +
      '<div><label for="mn-nom">Nombre del negocio</label><input id="mn-nom" value="' + attr(n.nombre || '') + '" placeholder="Ej. Odlare Apps"></div>' +
      '<div><label for="mn-pre">Prefijo de las facturas</label><input id="mn-pre" maxlength="6" value="' + attr(n.prefijo || '') + '" placeholder="Ej. OD"><div class="hint">Las facturas saldrán así: ' + esc((n.prefijo || 'OD') + '-001') + '</div></div>' +
      '<div class="full"><label>Tipo de negocio</label><div class="tipos">' + tipos + '</div></div>' +
      '<div class="full"><label for="mn-nf">Nombre en la factura (opcional)</label><input id="mn-nf" value="' + attr(n.nombreFactura || '') + '" placeholder="Si lo dejas vacío, sale «Tu nombre» de los ajustes"></div></div>' +
      '<h4>Factura de este negocio</h4><div class="grid">' +
      '<div class="full"><label>Fecha en cada línea de la factura</label><div class="fechas">' +
        [['event', 'Event date'], ['sale', 'Sale date'], ['service', 'Service date'], ['none', 'Sin fecha']].map((x) => '<button type="button" data-fl="' + x[0] + '" aria-pressed="' + (x[0] === (n.fechaLinea || ({ dj: 'event', productos: 'sale', servicios: 'service' })[n.tipo || 'servicios'])) + '">' + x[1] + '</button>').join('') + '</div></div>' +
      '<div class="full"><label for="mn-nota">Nota al pie (solo de este negocio)</label><textarea id="mn-nota" placeholder="Ej. Thank you for your business!">' + esc(n.nota || '') + '</textarea></div>' +
      '<div><label for="mn-mail">Email en la factura (opcional)</label><input id="mn-mail" type="email" value="' + attr(n.email || '') + '" placeholder="Si lo dejas vacío, el de tus ajustes"></div>' +
      '<div><label for="mn-tel">Teléfono en la factura (opcional)</label><input id="mn-tel" value="' + attr(n.telefono || '') + '" placeholder="Si lo dejas vacío, el de tus ajustes"></div></div>' +
      (n.id ? '<div class="fila"><div class="lgp">' + (logo ? '<img alt="" src="' + attr(logo) + '">' : '<span style="color:#9AA0B8;font-size:11px">Sin logo</span>') + '</div>' +
        '<button type="button" class="btn" data-mlogo="' + attr(n.id) + '">Subir logo</button>' + (logo ? '<button type="button" class="btn" data-mquitar="' + attr(n.id) + '">Quitar logo</button>' : '') +
        '<button type="button" class="btn" data-mcats="' + attr(n.tipo) + '">Añadir las categorías sugeridas</button></div>' : '') +
      '<div class="fila"><button type="button" class="btn primary" data-mguardar="1">' + (n.id ? 'Guardar negocio' : 'Crear negocio') + '</button><button type="button" class="btn" data-mcancel="1">Cancelar</button></div></div>';
  }
  function pintarMN() {
    if (!MN) return;
    const tipoN = (k) => ((MN.tipos || []).find((t) => t.clave === k) || {}).nombre || k;
    $('mn-lista').innerHTML = MN.lista.map((n) => (MNED && MNED.id === n.id) ? formMN(n) :
      '<div class="nr"><div class="lg">' + (MN.logos[n.id] ? '<img alt="" src="' + attr(MN.logos[n.id]) + '">' : '<span style="color:' + attr(n.color) + ';font-size:11px;font-weight:800">' + esc(n.prefijo) + '</span>') + '</div>' +
      '<div class="tx"><b><i style="background:' + attr(n.color) + '"></i>' + esc(n.nombre) + '</b><small>' + esc(tipoN(n.tipo)) + ' · facturas ' + esc(n.prefijo ? n.prefijo + '-001…' : '1, 2, 3…') + '</small></div>' +
      '<button type="button" class="btn" data-meditar="' + attr(n.id) + '">Editar</button></div>').join('') +
      (MNED && MNED.nuevo ? formMN({ tipo: 'servicios' }) : '');
    $('mn-add').classList.toggle('hidden', !!(MNED && MNED.nuevo));
  }
  $('mn-add').onclick = () => { MNED = { nuevo: true }; pintarMN(); mnm(''); const i = $('mn-nom'); if (i) i.focus(); };
  $('mn').addEventListener('click', (ev) => {
    const b = ev.target.closest('button'); if (!b || !MN) return;
    if (b.dataset.meditar) { MNED = { id: b.dataset.meditar }; pintarMN(); mnm(''); return; }
    if (b.dataset.mcancel) { MNED = null; pintarMN(); mnm(''); return; }
    if (b.dataset.tipo) {
      b.parentNode.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      const fl = { dj: 'event', productos: 'sale', servicios: 'service' }[b.dataset.tipo];   // la fecha de la factura sigue al tipo
      const ed = b.closest('.ed'); if (fl && ed) ed.querySelectorAll('[data-fl]').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.fl === fl)));
      return;
    }
    if (b.dataset.fl) { b.parentNode.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); return; }
    if (b.dataset.mlogo) { LOGOPARA = b.dataset.mlogo; $('lg-file').click(); return; }
    if (b.dataset.mquitar) {
      mnm('Quitando…');
      google.script.run.withSuccessHandler(() => { mnm('Logo quitado.', 'ok'); cargarMN(); }).withFailureHandler((e) => mnm(e.message.replace(/^Exception: /, ''), 'err')).quitarLogoNegocio(b.dataset.mquitar);
      return;
    }
    if (b.dataset.mcats) {
      b.disabled = true; mnm('Añadiendo…');
      google.script.run.withSuccessHandler((r) => {
        b.disabled = false;
        mnm((r.anadidas.length ? 'Añadidas: ' + r.anadidas.join(', ') + '.' : 'Ya tenías todas las sugeridas.') + (r.sinSitio.length ? ' No caben (máximo ' + (D ? D.catMax : 15) + '): ' + r.sinSitio.join(', ') + '.' : ''), 'ok');
        LISTAS = null; cargar();
      }).withFailureHandler((e) => { b.disabled = false; mnm(e.message.replace(/^Exception: /, ''), 'err'); }).anadirCategoriasSugeridas(b.dataset.mcats);
      return;
    }
    if (b.dataset.mguardar) {
      const ed = b.closest('.ed'), tipo = (ed.querySelector('.tipos [aria-pressed="true"]') || {}).dataset;
      const fl = (ed.querySelector('.fechas [aria-pressed="true"]') || {}).dataset;
      const o = { id: ed.dataset.ed || '', nombre: $('mn-nom').value, prefijo: $('mn-pre').value, nombreFactura: $('mn-nf').value, tipo: tipo ? tipo.tipo : 'dj',
        fechaLinea: fl ? fl.fl : '', nota: $('mn-nota').value, email: $('mn-mail').value, telefono: $('mn-tel').value };
      b.disabled = true; mnm('Guardando…');
      google.script.run.withSuccessHandler((r) => {
        MNED = o.id ? null : { id: r.id };
        cargarMN(() => mnm(o.id ? 'Negocio guardado.' : 'Negocio creado. Si quieres, súbele su logo.', 'ok'));
        cargar();
      }).withFailureHandler((e) => { b.disabled = false; mnm(e.message.replace(/^Exception: /, ''), 'err'); }).guardarNegocioDatos(o);
    }
  });
  $('lg-file').onchange = (ev) => {
    const f = ev.target.files[0]; ev.target.value = '';
    if (!f || !LOGOPARA) return;
    if (!/^image\/(png|jpeg)$/.test(f.type)) { mnm('Usa una imagen PNG o JPG.', 'err'); return; }
    if (f.size > 3 * 1024 * 1024) { mnm('La imagen pesa demasiado (máximo 3 MB).', 'err'); return; }
    const rd = new FileReader();
    rd.onload = () => {
      const im = new Image();
      im.onerror = () => mnm('No he podido leer esa imagen.', 'err');
      im.onload = () => {
        let w = Math.min(440, im.width), url = '';
        for (let k = 0; k < 4; k++) {
          const cv = document.createElement('canvas'); cv.width = w; cv.height = Math.max(1, Math.round(im.height * w / im.width));
          cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
          url = cv.toDataURL('image/png');
          if (url.length < 240000) break;
          w = Math.round(w * 0.75);
        }
        if (url.length >= 240000) { mnm('La imagen es muy compleja. Prueba con una más simple.', 'err'); return; }
        mnm('Guardando el logo…');
        google.script.run.withSuccessHandler(() => { mnm('Logo guardado.', 'ok'); cargarMN(); })
          .withFailureHandler((e) => mnm(e.message.replace(/^Exception: /, ''), 'err')).guardarLogoNegocio(LOGOPARA, url);
      };
      im.src = rd.result;
    };
    rd.readAsDataURL(f);
  };

  mostrar(TAB);
  cargar();

  return { mostrar: mostrar, destroy: () => { DEAD = true; clearTimeout(taxT); } };
}

/* ===== Impuestos ===== */
function init_impuestos(ROOT, P, S) {
  const $ = (id) => ROOT.querySelector('#' + id);
  const gbp = (n) => (n < 0 ? '-' : '') + '£' + Math.abs(Number(n) || 0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  let ANIO = '';
  function cargar() {
    google.script.run.withSuccessHandler(pintar)
      .withFailureHandler((e) => { $('im-body').innerHTML = '<div class="loading">No he podido calcular: ' + String(e.message).replace(/^Exception: /, '').replace(/</g, '&lt;') + '</div>'; })
      .getImpuestos({ anio: ANIO });
  }
  function ln(a, b, c) { return '<div class="ln ' + (c || '') + '"><span>' + a + '</span><b>' + b + '</b></div>'; }
  function pintar(r) {
    ANIO = r.anio;
    $('im-anio').textContent = 'Estimación orientativa del año fiscal ' + r.anio + ' (' + r.inicio + ' – ' + r.fin + ')';

    sel.classList.toggle('hidden', r.anios.length < 2);

      : r.metodo === 'gastos' ? 'Con tus gastos reales (' + gbp(r.gastos) + ') sales mejor que con el descuento fijo de £1,000 (Trading Allowance). El cálculo usa lo mejor para ti.'
      : 'Con el descuento fijo de £1,000 (Trading Allowance) sales mejor que con tus gastos reales (' + gbp(r.gastos) + '). El cálculo usa lo mejor para ti.';
    const toca = r.tocaPagar;
    $('im-body').innerHTML =
      '<div class="tiles">' +
        '<div class="tile t1"><div class="l">Ingresos del año</div><div class="v">' + gbp(r.ingresos) + '</div><div class="s">' + r.nFacturas + ' facturas</div></div>' +
        '<div class="tile t2"><div class="l">Gastos del año</div><div class="v">' + gbp(r.gastos) + '</div><div class="s">' + r.nGastos + ' gastos</div></div>' +
        '<div class="tile t3"><div class="l">Beneficio del negocio</div><div class="v">' + gbp(r.beneficio) + '</div><div class="s">ingresos − gastos</div></div>' +
        '<div class="tile t4"><div class="l">Impuesto estimado</div><div class="v">' + gbp(r.aPagar) + '</div><div class="s ' + (toca ? 'no' : 'ok') + '">' + (toca ? '! Tocaría pagar' : '✓ Por ahora no toca pagar') + '</div></div>' +
      '</div>' +
      ((r.porNegocio && r.porNegocio.length) ? '<div class="card pneg"><b>Por negocio</b><div class="hint">En la declaración (Self Assessment) cada negocio va en su propia sección de autónomo. El impuesto se calcula con el total.</div>' +
        '<table><thead><tr><th>Negocio</th><th class="r">Ingresos</th><th class="r">Gastos</th><th class="r">Beneficio</th></tr></thead><tbody>' +
        r.porNegocio.map((n) => '<tr><td><i style="background:' + n.color + '"></i>' + String(n.nombre).replace(/</g, '&lt;') + '</td><td class="r">' + gbp(n.ingresos) + '</td><td class="r">' + gbp(n.gastos) + '</td><td class="r"><b>' + gbp(n.beneficio) + '</b></td></tr>').join('') +
        '<tr class="tot"><td>Total (ingresos − gastos)</td><td class="r">' + gbp(r.ingresos) + '</td><td class="r">' + gbp(r.gastos) + '</td><td class="r"><b>' + gbp(r.ingresos - r.gastos) + '</b></td></tr></tbody></table></div>' : '') +
      '<div class="cols"><div class="col"><div class="card"><b>Cómo sale el cálculo</b>' +
        ln('Beneficio del negocio', gbp(r.beneficio)) +
        ln(r.sueldoDado ? 'Sueldo de la warehouse (lo que pusiste)' : 'Sueldo de la warehouse (no puesto)', gbp(r.sueldo)) +
        ln('Total de ingresos del año', gbp(r.total), 'tot') +
        ln('Libre de impuestos (Personal Allowance)', '− ' + gbp(r.pa)) +
        ln('Sobre lo que se paga impuesto', gbp(r.imponible)) +
        ln('Impuesto sobre la renta (por el negocio)', gbp(r.impuesto), r.impuesto > 0 ? '' : 'g') +
        ln('Seguridad Social autónomo (Class 4)', gbp(r.ni4), r.ni4 > 0 ? '' : 'g') +
        '<div class="nota">' + metodo + '</div>' +
        (r.sueldoDado ? '' : '<div class="aviso">Estimación solo con el beneficio de tu negocio. Si tienes nómina, el resultado puede subir: pon tu sueldo aproximado a la derecha.</div>') +
      '</div></div><div class="col">' +
        '<div class="card"><b>Tu sueldo de la warehouse (opcional)</b><div class="hint">Aproximado, al año y antes de impuestos. Tu empleador ya lo informa solo al HMRC; aquí solo sirve para afinar el cálculo. Mira "Gross pay" o "Pay to date" en tu nómina.</div>' +
        '<div class="sueldo"><input id="im-sueldo" type="number" min="0" step="1" inputmode="decimal" placeholder="Por ejemplo 10800" value="' + (r.sueldoDado ? r.sueldo : '') + '"><button class="btn primary" id="im-g" type="button">Guardar</button></div><div class="msg" id="im-msg" role="status"></div></div>' +
        '<div class="card"><b>Fechas importantes</b>' +
          (r.registrarte ? '<div class="fecha"><div class="bar" style="background:#F59E0B"></div><div><b>' + r.fechaRegistro + '</b><span>Registrarte en Self Assessment (HMRC): ya pasas de £1,000</span></div></div>'
            : '<div class="fecha"><div class="bar" style="background:#9CA3AF"></div><div><b>Aún no</b><span>No tienes que registrarte mientras no pases de £1,000 de ingresos en el año</span></div></div>') +

    pill: (id) => { const n = negInfo(id); return n ? '<span class="npill" style="background:' + escS(n.color) + '1F;color:' + escS(n.color) + '"><i style="background:' + escS(n.color) + '"></i>' + escS(n.nombre) + '</span>' : ''; } };
  window.SHELL = SHELL;
  document.querySelectorAll('.rail [data-go], .tb [data-go]').forEach((b) => (b.onclick = () => ir(b.dataset.go)));
  cargarHub();
  ir(CFG.vista === 'form' ? 'form:' + (CFG.tab || 'ingreso') : (CFG.vista || 'inicio'));
})();

</script>
</body>
